name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  aplikasi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Pasang Chromium untuk Playwright
        run: npx playwright install --with-deps chromium
      - name: Smoke test di browser (360, 390, 412, dan 1440 px)
        run: npm run test:e2e -- --trace off
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install --quiet -r scripts/requirements.txt
      - run: python -m pytest tests/python -q
